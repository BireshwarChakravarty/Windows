name: Build Windows for macOS

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version tag to publish, such as v1.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      # Needed only to publish a release for a version tag.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test layout and restoration logic
        run: swift test
      - name: Set up the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_CERT_P12" ]]; then
            echo "::warning::No SIGNING_CERT_P12 secret: this build is signed ad hoc, so macOS will ask for Accessibility again after updating. Run Scripts/signing/setup-github-signing.sh once to fix."
            exit 0
          fi
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          eval "$(Scripts/signing/import-certificate.sh "$RUNNER_TEMP/signing.p12" "$SIGNING_CERT_PASSWORD")"
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
      - name: Build and package the universal app
        run: ./Scripts/build-app.sh
      - name: Check that Accessibility access survives an update
        run: Scripts/ci/permission-persists.sh "$PWD/dist/Windows.app"
      - name: Grant Accessibility on the CI Mac
        continue-on-error: true
        run: |
          sudo python3 Scripts/ci/grant-accessibility.py "$PWD/dist/Windows.app"
          sudo killall tccd || true
      - name: Snap real windows end to end
        run: Scripts/ci/snap-e2e.sh "$PWD/dist/Windows.app"
      - name: Upload snap check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snap-e2e
          path: ${{ runner.temp }}/snap-e2e/*.*
          if-no-files-found: warn
      - name: Render the panel with example data
        if: always()
        continue-on-error: true
        run: |
          perl -e 'alarm shift; exec @ARGV' 120 dist/Windows.app/Contents/MacOS/Windows --render-previews "$RUNNER_TEMP/renders"
          ls -l "$RUNNER_TEMP/renders"
      - name: Upload panel renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-renders
          path: ${{ runner.temp }}/renders
          if-no-files-found: warn
      - name: Upload Windows.app
        uses: actions/upload-artifact@v7
        with:
          path: dist/Windows-macOS26.zip
          archive: false
          if-no-files-found: error
      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          path: dist/Windows-macOS26.dmg
          archive: false
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          # Creates the tag at the built commit when it does not exist yet.
          gh release create "$TAG" dist/Windows-macOS26.dmg dist/Windows-macOS26.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Windows ${TAG#v}" --notes-file .github/release-notes.md

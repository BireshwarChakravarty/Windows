name: Build Windows for macOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test layout and restoration logic
        run: swift test
      - name: Build and package the universal app
        run: ./Scripts/build-app.sh
      - name: Upload Windows.app
        uses: actions/upload-artifact@v7
        with:
          path: dist/Windows-macOS26.zip
          archive: false
          if-no-files-found: error
